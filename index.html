<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>高校受験AI学習システム</title>
  <style>
    /* =========================================================
       基本スタイル & タブレットスクロール最適化
       ========================================================= */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #f4f7f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #333;
      /* 画面全体の縦スクロールを明示的に有効化 */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .app-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ヘッダー */
    header {
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #2c3e50;
    }

    .user-select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      background: #fff;
    }

    /* 問題カード */
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #e8f4fd;
      color: #1976d2;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .question-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 0 12px 0;
      color: #1a1a1a;
    }

    .question-context {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }

    .visual-container {
      margin: 16px 0;
      display: flex;
      justify-content: center;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }

    .sub-questions-list {
      list-style-type: none;
      padding: 0;
      margin: 16px 0 0 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sub-question-item {
      background: #f8f9fa;
      border-left: 4px solid #3498db;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
    }

    .sub-q-num {
      font-weight: bold;
      color: #2980b9;
      margin-right: 8px;
    }

    .sub-q-points {
      float: right;
      font-size: 0.85rem;
      color: #7f8c8d;
      font-weight: bold;
    }

    /* =========================================================
       手書きキャンバスエリア
       ========================================================= */
    .canvas-section {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .canvas-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .tool-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-tool {
      background: #f1f2f6;
      color: #333;
      border: 1px solid #dcdde1;
    }

    .btn-tool.active {
      background: #3498db;
      color: #fff;
      border-color: #2980b9;
    }

    .btn-action {
      background: #e74c3c;
      color: #fff;
    }

    .btn-submit {
      background: #2ecc71;
      color: #fff;
      font-size: 1.1rem;
      padding: 12px 24px;
      width: 100%;
      margin-top: 16px;
      box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      border: 2px solid #dfe6e9;
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
    }

    /* キャンバス自体のタッチ設定 */
    #drawing-canvas {
      display: block;
      width: 100%;
      height: 480px;
      background: #ffffff;
      /* 1本指での意図しないブラウザ拡大・画面スクロールを防ぎ、キャンバス内描画に集中させる */
      touch-action: none;
    }

    .canvas-hint {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-top: 6px;
      text-align: right;
    }

    /* 採点結果モーダル/表示 */
    .result-section {
      display: none;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-top: 6px solid #2ecc71;
    }

    .score-banner {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 16px;
      color: #27ae60;
    }

    .feedback-box {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    /* ローディング表示 */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-title">高校入試数学 AI演習</div>
      <select id="user-select" class="user-select" onchange="changeUser()">
        <option value="user_nozomi">のぞみ</option>
        <option value="user_yui">ゆい</option>
        <option value="user_chiemi">ちえみ</option>
        <option value="user_jun">じゅん</option>
        <option value="user_yozo">ようぞう</option>
      </select>
    </header>

    <div class="card" id="question-card">
      <div class="badge" id="pref-badge">公立高校入試 類題</div>
      <h2 class="question-title" id="question-title">問題を読み込み中...</h2>
      <div class="question-context" id="question-context"></div>
      
      <div class="visual-container" id="visual-container" style="display: none;">
        <svg id="svg-stage" width="400" height="260" viewBox="0 0 400 260"></svg>
      </div>

      <ul class="sub-questions-list" id="sub-questions-list"></ul>
    </div>

    <div class="canvas-section">
      <div class="canvas-toolbar">
        <div class="tool-group">
          <button class="btn btn-tool active" id="tool-pen" onclick="setTool('pen')">✏️ ペン (黒)</button>
          <button class="btn btn-tool" id="tool-eraser" onclick="setTool('eraser')">🧹 消しゴム</button>
          <button class="btn btn-tool" id="tool-mode" onclick="toggleTouchMode()">👆 指でスクロール: ON</button>
        </div>
        <button class="btn btn-action" onclick="clearCanvas()">全消去</button>
      </div>

      <div class="canvas-wrapper">
        <canvas id="drawing-canvas"></canvas>
      </div>
      <div class="canvas-hint">※タブレット操作：2本指で上下に画面スクロールが可能です</div>

      <button class="btn btn-submit" id="btn-submit" onclick="submitAnswer()">解答を送信してAI採点する</button>
    </div>

    <div class="result-section" id="result-section">
      <div class="score-banner" id="score-banner">15 / 15 点 (クリア!)</div>
      <div class="feedback-box">
        <strong>【AI総評・アドバイス】</strong>
        <p id="ai-feedback-text"></p>
      </div>
      <div id="sub-scores-container"></div>
      <button class="btn btn-submit" style="background:#3498db;" onclick="loadNewQuestion()">次の問題に挑戦する</button>
    </div>
  </div>

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" style="font-weight:bold; color:#2c3e50;">AIが入試問題を生成しています...</div>
  </div>

  <script>
    // =========================================================
    // 設定 & 状態管理
    // =========================================================
    // ※GAS WebアプリのURL（同一オリジンの場合は空文字、HTML埋め込みの場合はGASのdoGet/doPostを呼び出します）
    let currentQuestion = null;
    let currentUserId = 'user_nozomi';
    let currentTool = 'pen';
    let allowFingerDrawing = false; // true: 1本指でも描画, false: ペンのみ描画で1本指はスクロール

    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let isDrawing = false;

    // =========================================================
    // キャンバス初期化・高解像度Retina対応
    // =========================================================
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      // 内部解像度をデバイスピクセル比に合わせる
      canvas.width = rect.width * dpr;
      canvas.height = 480 * dpr;
      
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2.5;
    }

    window.addEventListener('resize', resizeCanvas);

    // =========================================================
    // タッチ & ペン描画イベント（2本指スクロール & スタイラス最適化）
    // =========================================================
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Pointer Events による精密なペン・指の判定
    canvas.addEventListener('pointerdown', (e) => {
      // 指タッチで「指スクロール優先モード」の場合は描画を開始しない（ブラウザスクロールを許可）
      if (e.pointerType === 'touch' && !allowFingerDrawing) {
        return;
      }

      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.beginPath();
      ctx.moveTo(x, y);

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 24;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = e.pointerType === 'pen' ? 2.5 : 3.0;
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.lineTo(x, y);
      ctx.stroke();
    });

    window.addEventListener('pointerup', () => {
      if (isDrawing) {
        isDrawing = false;
        ctx.closePath();
      }
    });

    // タッチイベントのバックアップ（2本指判定用）
    canvas.addEventListener('touchstart', (e) => {
      // 2本指以上のタッチは画面スクロールを最優先する
      if (e.touches.length > 1) {
        isDrawing = false;
        return;
      }

      if (allowFingerDrawing) {
        e.preventDefault(); // 1本指描画モード時のみデフォルトのスクロールを抑制
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) {
        // 2本指スクロールを許可
        return;
      }

      if (allowFingerDrawing && isDrawing) {
        e.preventDefault();
      }
    }, { passive: false });

    // =========================================================
    // ツールバー操作
    // =========================================================
    function setTool(tool) {
      currentTool = tool;
      document.getElementById('tool-pen').classList.toggle('active', tool === 'pen');
      document.getElementById('tool-eraser').classList.toggle('active', tool === 'eraser');
    }

    function toggleTouchMode() {
      allowFingerDrawing = !allowFingerDrawing;
      const btn = document.getElementById('tool-mode');
      if (allowFingerDrawing) {
        btn.innerText = '✏️ 1本指で描画: ON';
        btn.classList.add('active');
      } else {
        btn.innerText = '👆 指でスクロール: ON';
        btn.classList.remove('active');
      }
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // =========================================================
    // API通信 & 問題ロード
    // =========================================================
    function showLoading(text) {
      document.getElementById('loading-text').innerText = text;
      document.getElementById('loading-overlay').style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loading-overlay').style.display = 'none';
    }

    function changeUser() {
      currentUserId = document.getElementById('user-select').value;
      loadNewQuestion();
    }

    function loadNewQuestion() {
      showLoading('類題をAIが生成しています...');
      document.getElementById('result-section').style.display = 'none';
      clearCanvas();

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        // GAS 環境
        google.script.run
          .withSuccessHandler(onQuestionLoaded)
          .withFailureHandler(onError)
          .doGet({ parameter: { user_id: currentUserId } });
      } else {
        // ローカルテスト用モック
        setTimeout(() => {
          onQuestionLoaded({
            status: 'success',
            data: {
              question_id: 'LOCAL_TEST_01',
              pref_ref: '北海道公立入試類題',
              unit: '一次関数と図形',
              title: '直線と三角形の面積二等分',
              context_text: '座標平面上に直線 ℓ: y = x + 4 があり、点A(-2, 2)と点B(4, 8)を通っています。直線ℓとy軸の交点をCとします。',
              sub_questions_json: JSON.stringify([
                { q: 1, points: 4, text: '点Cの座標を求めなさい。', answer: '(0, 4)' },
                { q: 2, points: 5, text: '△OABの面積を求めなさい。', answer: '12' },
                { q: 3, points: 6, text: '原点Oを通り△OABの面積を2等分する直線mの式を求めなさい。', answer: 'y = 5x' }
              ]),
              has_visual: true,
              svg_config_json: JSON.stringify({
                type: 'linear_and_triangle',
                pointA: { x: -2, y: 2, label: 'A(-2, 2)' },
                pointB: { x: 4, y: 8, label: 'B(4, 8)' }
              })
            }
          });
        }, 1000);
      }
    }

    function onQuestionLoaded(res) {
      hideLoading();
      if (res.status !== 'success') {
        alert('エラーが発生しました: ' + res.message);
        return;
      }

      currentQuestion = res.data;
      renderQuestion(currentQuestion);
    }

    function renderQuestion(q) {
      document.getElementById('pref-badge').innerText = `${q.pref_ref} 【${q.unit}】`;
      document.getElementById('question-title').innerText = q.title;
      document.getElementById('question-context').innerText = q.context_text;

      // 小問リスト描画
      const subList = document.getElementById('sub-questions-list');
      subList.innerHTML = '';
      const subs = typeof q.sub_questions_json === 'string' ? JSON.parse(q.sub_questions_json) : q.sub_questions_json;
      
      subs.forEach(s => {
        const li = document.createElement('li');
        li.className = 'sub-question-item';
        li.innerHTML = `
          <span class="sub-q-num">(${s.q})</span>
          <span>${s.text}</span>
          <span class="sub-q-points">${s.points}点</span>
        `;
        subList.appendChild(li);
      });

      // SVG図形描画
      const visualContainer = document.getElementById('visual-container');
      if (q.has_visual) {
        visualContainer.style.display = 'flex';
        renderSVGVisual(q.svg_config_json);
      } else {
        visualContainer.style.display = 'none';
      }
    }

    function renderSVGVisual(svgConfigRaw) {
      const stage = document.getElementById('svg-stage');
      stage.innerHTML = '';
      const config = typeof svgConfigRaw === 'string' ? JSON.parse(svgConfigRaw || '{}') : svgConfigRaw;

      // 簡易座標軸と直線の描画
      let svgHtml = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" />
          </marker>
        </defs>
        <line x1="40" y1="200" x2="360" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)" />
        <line x1="200" y1="230" x2="200" y2="30" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="365" y="205" font-size="12" fill="#555">x</text>
        <text x="195" y="20" font-size="12" fill="#555">y</text>
        <text x="185" y="215" font-size="12" fill="#555">O</text>
      `;

      if (config.type === 'linear_and_triangle' || config.type === 'inverse_and_linear') {
        svgHtml += `
          <line x1="80" y1="220" x2="320" y2="60" stroke="#3498db" stroke-width="2.5" />
          <circle cx="120" cy="190" r="4" fill="#e74c3c" />
          <text x="80" y="185" font-size="12" font-weight="bold" fill="#333">A(-2, 2)</text>
          <circle cx="280" cy="85" r="4" fill="#e74c3c" />
          <text x="285" y="80" font-size="12" font-weight="bold" fill="#333">B(4, 8)</text>
        `;
      } else if (config.type === 'moving_point_rect') {
        svgHtml = `
          <rect x="100" y="50" width="200" height="150" fill="none" stroke="#2c3e50" stroke-width="2" />
          <text x="85" y="50" font-size="14" font-weight="bold">A</text>
          <text x="85" y="205" font-size="14" font-weight="bold">B</text>
          <text x="305" y="205" font-size="14" font-weight="bold">C</text>
          <text x="305" y="50" font-size="14" font-weight="bold">D</text>
          <circle cx="100" cy="120" r="5" fill="#e74c3c" />
          <text x="75" y="125" font-size="13" font-weight="bold" fill="#e74c3c">P →</text>
        `;
      }

      stage.innerHTML = svgHtml;
    }

    // =========================================================
    // 解答送信 & AI採点
    // =========================================================
    function submitAnswer() {
      if (!currentQuestion) return;

      const base64Image = canvas.toDataURL('image/jpeg', 0.85);
      showLoading('AI採点官が手書き答案を採点中...');

      const payload = {
        user_id: currentUserId,
        user_name: document.getElementById('user-select').selectedOptions[0].text,
        question_id: currentQuestion.question_id,
        image_base64: base64Image
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onGraded)
          .withFailureHandler(onError)
          .doPost({ postData: { contents: JSON.stringify(payload) } });
      } else {
        // ローカルテスト用モック
        setTimeout(() => {
          onGraded({
            status: 'success',
            data: {
              total_score: 15,
              max_score: 15,
              is_cleared: true,
              scores: [
                { q: 1, score: 4, max: 4, is_correct: true, comment: '正解です。' },
                { q: 2, score: 5, max: 5, is_correct: true, comment: '正しく三角形の面積を計算できています。' },
                { q: 3, score: 6, max: 6, is_correct: true, comment: '原点を通る直線の傾きが完璧に導出されています。' }
              ],
              ai_feedback: '全問正解です！等積変形と傾きの導出が極めてスムーズにできています。この調子で応用問題に進みましょう。',
              next_action: 'NEXT_UNIT'
            }
          });
        }, 1500);
      }
    }

    function onGraded(res) {
      hideLoading();
      if (res.status !== 'success') {
        alert('採点エラー: ' + res.message);
        return;
      }

      const evalData = res.data;
      const resSection = document.getElementById('result-section');
      resSection.style.display = 'block';

      const banner = document.getElementById('score-banner');
      banner.innerText = `${evalData.total_score} / ${evalData.max_score} 点 (${evalData.is_cleared ? '合格・クリア！' : '要復習'})`;
      banner.style.color = evalData.is_cleared ? '#27ae60' : '#e74c3c';

      document.getElementById('ai-feedback-text').innerText = evalData.ai_feedback;

      const subContainer = document.getElementById('sub-scores-container');
      subContainer.innerHTML = '';
      evalData.scores.forEach(s => {
        const item = document.createElement('div');
        item.style.padding = '8px 12px';
        item.style.margin = '6px 0';
        item.style.borderRadius = '6px';
        item.style.background = s.is_correct ? '#e8f8f5' : '#fdedec';
        item.innerHTML = `
          <strong>小問(${s.q}): ${s.score} / ${s.max}点</strong> 【${s.is_correct ? '⭕ 正解' : '❌ 不正解'}】
          <div style="font-size:0.9rem; color:#555; margin-top:4px;">${s.comment}</div>
        `;
        subContainer.appendChild(item);
      });

      // 採点結果位置まで滑らかにスクロール
      resSection.scrollIntoView({ behavior: 'smooth' });
    }

    function onError(err) {
      hideLoading();
      alert('エラーが発生しました: ' + err.toString());
    }

    // 起動時処理
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      loadNewQuestion();
    });
  </script>
</body>
</html>
